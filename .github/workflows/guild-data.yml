name: Guild data

# Re-exports the guild roster from the Blizzard API once a day and publishes
# it to the `guild-data` branch. The companion updater pulls from there; the
# addon reads whatever the companion dropped into Data/GuildData.lua.
#
# Nothing is committed unless item levels actually changed -- the exporter
# stamps a fresh generated_at every run, so a plain file diff is always dirty.
#
# Requires two repository secrets/vars:
#   BLIZZARD_CLIENT_ID -> Variable
#   BLIZZARD_CLIENT_SECRET -> Secret
# Create them at https://develop.battle.net/access/clients

on:
  schedule:
    # 09:00 UTC daily -- early morning US, well before raid time.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      realm:
        description: "Guild's home realm slug"
        default: khadgar
      guild:
        description: 'Guild name'
        default: 'Riddle of Steel'
      region:
        description: 'API region'
        default: us
      force:
        description: 'Publish even if nothing changed'
        type: boolean
        default: false

permissions:
  contents: read

# A slow export must never race the next day's run. This serialises every run of
# THIS workflow -- schedule and workflow_dispatch share the group -- so two of
# its own runs can never both hold the data branch. It does not stop a human
# pushing to the branch between this run's fetch and its push, which the publish
# step below handles for itself.
concurrency:
  group: guild-data
  cancel-in-progress: false

env:
  DATA_BRANCH: guild-data
  DATA_FILE: GuildData.lua

jobs:
  export:
    name: Export and publish
    runs-on: ubuntu-latest

    # Granted on the job rather than the workflow. One job today, so it changes
    # nothing now; it stops a second job added later from inheriting write.
    permissions:
      contents: write

    steps:
      - name: Check out tools
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch currently published data
        id: published
        run: |
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            echo "Data branch exists; fetching it."
            git fetch --depth=1 origin "$DATA_BRANCH"
            if git show "origin/$DATA_BRANCH:$DATA_FILE" > old.lua 2>/dev/null; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "Branch exists but has no $DATA_FILE yet."
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
            echo "branch=true" >> "$GITHUB_OUTPUT"
          else
            echo "No data branch yet; this will be the first publish."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "branch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Export roster
        id: export
        env:
          BLIZZARD_CLIENT_ID: ${{ vars.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          REALM: ${{ inputs.realm || 'khadgar' }}
          GUILD: ${{ inputs.guild || 'Riddle of Steel' }}
          REGION: ${{ inputs.region || 'us' }}
        run: |
          if [ -z "$BLIZZARD_CLIENT_ID" ] || [ -z "$BLIZZARD_CLIENT_SECRET" ]; then
            echo "::error::BLIZZARD_CLIENT_ID / BLIZZARD_CLIENT_SECRET are not set as repository secrets."
            exit 1
          fi

          python Tools/fetch_guild_info.py \
            --region "$REGION" \
            --realm "$REALM" \
            --guild "$GUILD" \
            --out new.lua

      # Values reach the script through env:, not by ${{ }} substitution into
      # the source -- the same pattern that let a git tag execute on a runner in
      # sidecar.yml. These particular values are our own, but the shape is what
      # matters.
      - name: Decide whether to publish
        id: compare
        env:
          OLD_EXISTS: ${{ steps.published.outputs.exists }}
          FORCE: ${{ inputs.force }}
        run: |
          set +e
          if [ "$OLD_EXISTS" = "true" ]; then
            python Tools/compare_guild_data.py --new new.lua --old old.lua --summary commit-msg.txt
          else
            python Tools/compare_guild_data.py --new new.lua --summary commit-msg.txt
          fi
          status=$?
          set -e

          case "$status" in
            0)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            1)
              if [ "$FORCE" = "true" ]; then
                echo "Unchanged, but force was requested."
                echo "Refresh guild data timestamp" > commit-msg.txt
                echo "publish=true" >> "$GITHUB_OUTPUT"
              else
                echo "publish=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "::error::The new export failed its sanity check. Nothing was published."
              exit 1
              ;;
          esac

      - name: Publish to data branch
        id: publish
        if: steps.compare.outputs.publish == 'true'
        env:
          BRANCH_EXISTS: ${{ steps.published.outputs.branch }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Written once to the workspace so the retry below can re-apply it
          # without re-running the heredoc.
          cat > publish-readme.md <<'EOF'
          # RoS-Tools guild data

          Generated by the `Guild data` workflow. Do not edit or open pull
          requests against this branch -- it is overwritten by automation and
          holds no source code.

          `GuildData.lua` is consumed by the RoS-Tools Sidecar, and by the
          CurseForge release workflow on the default branch.
          EOF

          if [ "$BRANCH_EXISTS" = "true" ]; then
            git worktree add publish "origin/$DATA_BRANCH"
            git -C publish switch -C "$DATA_BRANCH"
          else
            git worktree add --detach publish HEAD
            git -C publish switch --orphan "$DATA_BRANCH"
            # An orphan branch inherits the working tree; clear it so the
            # data branch holds nothing but the payload.
            find publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

          apply_payload() {
            cp "$GITHUB_WORKSPACE/new.lua" "publish/$DATA_FILE"
            cp "$GITHUB_WORKSPACE/publish-readme.md" publish/README.md
            git -C publish add "$DATA_FILE" README.md
          }

          apply_payload
          git -C publish commit -F "$GITHUB_WORKSPACE/commit-msg.txt"

          # The concurrency group serialises this workflow against itself, but
          # nothing stops a maintainer pushing to the data branch between the
          # fetch at the top of this run and the push here -- and a rejected
          # push used to fail the step while the summary still said "Published".
          # The data branch is generated output that automation overwrites (its
          # own README says so), so the resolution is to take the branch's new
          # tip and re-apply this run's payload on top, never to merge two
          # machine-written files.
          attempt=1
          until git -C publish push origin "$DATA_BRANCH"; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::Could not push to $DATA_BRANCH after $attempt attempts."
              exit 1
            fi
            echo "::warning::Push rejected on attempt $attempt -- $DATA_BRANCH moved. Re-applying onto its new tip."
            attempt=$((attempt + 1))

            git fetch --depth=1 --force origin "$DATA_BRANCH"
            git -C publish reset --hard "origin/$DATA_BRANCH"
            apply_payload

            if ! git -C publish commit -F "$GITHUB_WORKSPACE/commit-msg.txt"; then
              echo "The new tip of $DATA_BRANCH already carries this payload; nothing left to push."
              exit 0
            fi
          done

          echo "Published to $DATA_BRANCH."

      # Reports what actually happened, not what was decided. This used to key
      # off steps.compare.outputs.publish alone, so a publish that failed on a
      # non-fast-forward push still printed "Published: ..." above a red run.
      - name: Summary
        if: always()
        env:
          PUBLISH: ${{ steps.compare.outputs.publish }}
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          {
            echo "### Guild data"
            echo
            if [ "$EXPORT_OUTCOME" != "success" ]; then
              echo "**The export failed** (\`${EXPORT_OUTCOME:-skipped}\`). Nothing was published."
            elif [ "$COMPARE_OUTCOME" != "success" ]; then
              echo "**The new export failed its sanity check** (\`${COMPARE_OUTCOME:-skipped}\`). Nothing was published."
            elif [ "$PUBLISH" != "true" ]; then
              echo "No item level changes; nothing published."
            elif [ "$PUBLISH_OUTCOME" = "success" ]; then
              echo "Published: $(cat commit-msg.txt 2>/dev/null || echo 'see log')"
            else
              echo "**The publish step did not succeed** (\`${PUBLISH_OUTCOME:-skipped}\`) -- \`$DATA_BRANCH\` was NOT updated."
              echo
              echo "Intended commit: $(cat commit-msg.txt 2>/dev/null || echo 'see log')"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
