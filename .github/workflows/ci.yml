name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint Lua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Run luacheck
        run: luacheck .

  package:
    name: Package addon
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          VERSION=$(grep -oP '^## Version:\s*\K.*' Riddled.toc | tr -d '\r')
          mkdir -p build/Riddled
          rsync -a --exclude='.git*' --exclude='build' --exclude='Tools' \
                --exclude='*.md' ./ build/Riddled/
          cd build && zip -r "Riddled-${VERSION}.zip" Riddled
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Riddled-${{ env.VERSION }}
          path: build/*.zip
